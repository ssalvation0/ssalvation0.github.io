<html lang="en">

    <meta charset="UTF-8" />

    />

    <link rel="canonical" href="https://ssalvation0.github.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nazar Stefiniv" />
    <meta property="og:url" content="https://ssalvation0.github.io/" />
    <meta property="og:title" content="Nazar Stefiniv — Web Developer" />
    <meta
      property="og:description"
      content="Web developer & CS student. React · TypeScript · Supabase. Projects, skills and contact."
    />
    <meta property="og:image" content="https://ssalvation0.github.io/og.jpg" />

      content="Nazar Stefiniv — Web Developer portfolio"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nazar Stefiniv — Web Developer" />
    <meta
      name="twitter:description"
      content="Web developer & CS student. React · TypeScript · Supabase."
    />
    <meta name="twitter:image" content="https://ssalvation0.github.io/og.jpg" />

    <!-- Theme color — kept in sync with the active (toggled or system) theme via JS below. -->
    <meta name="theme-color" content="#fafaf9" />

    <!-- Structured data so search engines can show a proper profile result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nazar Stefiniv",
        "url": "https://ssalvation0.github.io/",
        "jobTitle": "Web Developer",
        "email": "mailto:nazar.stefiniv0@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lublin",
          "addressCountry": "PL"
        },
        "knowsAbout": ["React", "TypeScript", "JavaScript", "Node.js", "Supabase"],
        "sameAs": ["https://github.com/ssalvation0", "https://t.me/sssalvation"]
      }
    </script>

    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx). -->

    <!-- Set theme before first paint to avoid a flash of the wrong theme (FOUC). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#09090b" : "#fafaf9");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
